plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
}

android {
    compileSdk 37

    defaultConfig {
        applicationId "com.ihegyi.alexiguitartuner"
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName "1.0"

        testInstrumentationRunner "com.ihegyi.alexiguitartuner.HiltTestRunner"
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.ihegyi.alexiguitartuner'
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.runtime:runtime:1.12.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.7'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'

    implementation "androidx.lifecycle:lifecycle-service:2.8.7"

    // Tarsos-DSP
    implementation files('libs/TarsosDSP-Android.jar')

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'

    // Room
    implementation "androidx.room:room-runtime:2.8.5"

    ksp "androidx.room:room-compiler:2.8.5"

    // Kotlin Extensions and Coroutines support for Room
    implementation "androidx.room:room-ktx:2.8.5"

    //Dagger - Hilt
    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-android-compiler:2.60.1'

    //Local test dependencies
    androidTestImplementation 'androidx.test:rules:1.6.1'
    testImplementation "androidx.test:core:1.6.1"
    testImplementation 'app.cash.turbine:turbine:1.2.0'
    testImplementation "junit:junit:4.13.2"
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
    testImplementation 'org.mockito:mockito-core:5.15.2'

    //Instrumented test dependencies
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.60.1'
    kspAndroidTest 'com.google.dagger:hilt-android-compiler:2.60.1'
    testImplementation "androidx.test:monitor:1.7.2"
    androidTestImplementation "junit:junit:4.13.2"
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'org.mockito:mockito-android:5.15.2'
}
